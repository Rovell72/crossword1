<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска коллектива — кроссворд</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cork:#b98657; --cork2:#a9774a; --note:#ffe566; --noteWord:#ffc9dc; --noteSel:#7fd8ff;
  --ink:#2b2a33; --red:#d9322e; --green:#1f8f4e; --paper:#fffdf7; --line:#cfe3f4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);min-height:100vh;padding:26px 14px 50px;
  background-color:var(--cork);
  background-image:radial-gradient(rgba(70,40,15,.22) 1.2px,transparent 1.6px),radial-gradient(rgba(255,230,190,.18) 1px,transparent 1.5px);
  background-size:14px 14px,23px 23px;background-position:0 0,7px 9px;
}
.wrap{max-width:1060px;margin:0 auto}
.head{position:relative;display:inline-block;background:var(--paper);padding:14px 26px 14px 22px;margin:0 0 26px 8px;transform:rotate(-1.4deg);
  box-shadow:0 6px 14px rgba(40,20,5,.35);max-width:96%}
.head::before{content:"";position:absolute;top:-9px;left:50%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8d86,var(--red) 60%,#8c1612);box-shadow:0 3px 3px rgba(0,0,0,.35)}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(34px,6.5vw,60px);margin:0;line-height:1}
.head p{margin:4px 0 0;font-weight:700;color:#6b6a74;font-size:14px}

.main{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
@media(max-width:920px){.main{grid-template-columns:1fr}}
.board{overflow-x:auto;padding:12px 8px 18px}
#grid{display:grid;gap:6px;width:max-content;margin:0 auto}
.cell{position:relative;width:var(--s);height:var(--s)}
.cell input{width:100%;height:100%;border:0;border-radius:3px 3px 6px 3px;background:var(--note);color:var(--ink);text-align:center;
  font:700 calc(var(--s)*.64) 'Caveat',cursive;text-transform:uppercase;padding:0;cursor:pointer;outline:none;caret-color:transparent;
  box-shadow:0 3px 5px rgba(40,20,5,.4),inset 0 -8px 10px -8px rgba(160,120,0,.45);transition:background .12s,transform .12s}
.cell input.inword{background:var(--noteWord)}
.cell input.sel{background:var(--noteSel);transform:scale(1.12) rotate(-2deg);position:relative;z-index:3;box-shadow:0 8px 14px rgba(40,20,5,.45)}
.cell input.hinted{color:var(--red)}
.cell input.right{color:var(--green)}
.cell input.wrong{background:#ff9d96;animation:shake .35s}
.cell input:focus-visible{outline:3px solid #fff;outline-offset:1px}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.num{position:absolute;top:2px;left:4px;font:800 calc(var(--s)*.24) 'Nunito',sans-serif;color:rgba(43,42,51,.6);pointer-events:none;z-index:4;line-height:1}

.panel{display:flex;flex-direction:column;gap:18px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
button{font:800 15px 'Nunito',sans-serif;color:var(--ink);background:var(--paper);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;
  box-shadow:0 3px 0 rgba(40,20,5,.45);transition:transform .08s,box-shadow .08s}
button:hover{background:#fff}
button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
button.go{background:#ff7a59;color:#fff}
button.go:hover{background:#ff8d70}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.counter{font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(40,20,5,.6);font-size:15px}
.card{position:relative;background:var(--paper);padding:18px 20px 14px;box-shadow:0 8px 18px rgba(40,20,5,.35);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 30px;background-position:0 12px}
.card:nth-of-type(odd){transform:rotate(.5deg)} .card:nth-of-type(even){transform:rotate(-.5deg)}
.card h2{font-family:'Caveat',cursive;font-size:30px;margin:0 0 6px;line-height:1}
.card ol{list-style:none;margin:0;padding:0}
.card li{display:flex;gap:10px;padding:0 6px;min-height:30px;align-items:center;cursor:pointer;font-weight:700;font-size:15px;line-height:1.25;border-radius:6px;padding-block:3px}
.card li:hover{background:rgba(255,229,102,.55)}
.card li.active{background:var(--noteSel)}
.card li.done{color:var(--green)}
.card li.done span{text-decoration:line-through}
.card li b{font-family:'Caveat',cursive;font-size:24px;min-width:22px;color:var(--red);line-height:1}
.card li small{font-weight:600;color:#7a7985}
#win{display:none;background:#fff;border:3px dashed var(--green);color:var(--green);font-family:'Caveat',cursive;font-size:30px;font-weight:700;padding:10px 16px;transform:rotate(-1deg)}
#win.show{display:block;animation:pop .5s}
@keyframes pop{from{transform:scale(.8) rotate(-4deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Доска коллектива</h1>
    <p>Кроссворд про работу в команде. Клик по той же клетке меняет направление слова.</p>
  </div>
  <div class="main">
    <div class="board"><div id="grid" aria-label="Сетка кроссворда"></div></div>
    <div class="panel">
      <div class="tools">
        <button class="go" id="bLetter">Открыть букву</button>
        <button id="bWord">Открыть слово</button>
        <button id="bCheck">Проверить</button>
        <button id="bReset">Сначала</button>
      </div>
      <div class="counter" id="count"></div>
      <div id="win">Ура! Все стикеры на месте!</div>
      <div class="card"><h2>По горизонтали</h2><ol id="cAcross"></ol></div>
      <div class="card"><h2>По вертикали</h2><ol id="cDown"></ol></div>
    </div>
  </div>
</div>

<script>
// r, c — строка и столбец первой буквы (могут быть отрицательными). Сетка и номера строятся сами.
const WORDS = [
  {a:'КОРПОРАТИВ', r:3,  c:0,  d:'across', q:'Совместное праздничное мероприятие сотрудников'},
  {a:'ДОГОВОР',    r:2,  c:1,  d:'down',   q:'Письменное соглашение работника и работодателя'},
  {a:'ПРОФСОЮЗ',   r:3,  c:3,  d:'down',   q:'Организация, защищающая права работников'},
  {a:'ЗАДАЧА',     r:2,  c:6,  d:'down',   q:'Конкретное задание, которое нужно выполнить'},
  {a:'ГРАФИК',     r:-1, c:8,  d:'down',   q:'Расписание рабочих смен и часов'},
  {a:'ЮМОР',       r:8,  c:-2, d:'across', q:'Помогает разрядить обстановку в команде'},
  {a:'ЗАЩИТА',     r:10, c:3,  d:'across', q:'Охрана прав и интересов работников'},
  {a:'АВАНС',      r:10, c:8,  d:'down',   q:'Часть зарплаты, выплачиваемая до основного расчёта'}
];

const $ = id => document.getElementById(id);
const gridEl=$('grid'), cells=new Map(), key=(r,c)=>r+','+c;
const norm = s => s.toUpperCase().replace(/Ё/g,'Е');
const cellsOf = w => Array.from({length:w.a.length},(_,i)=>[w.r+(w.d==='down'?i:0), w.c+(w.d==='across'?i:0)]);

const all=WORDS.flatMap(cellsOf);
const minR=Math.min(...all.map(x=>x[0])), maxR=Math.max(...all.map(x=>x[0]));
const minC=Math.min(...all.map(x=>x[1])), maxC=Math.max(...all.map(x=>x[1]));
const rows=maxR-minR+1, cols=maxC-minC+1;

const startKeys=[...new Set(WORDS.map(w=>key(w.r,w.c)))].sort((x,y)=>{
  const [a,b]=x.split(',').map(Number),[c,d]=y.split(',').map(Number); return a-c||b-d;});
WORDS.forEach(w=>w.n=startKeys.indexOf(key(w.r,w.c))+1);

function sizeCells(){
  const avail=Math.min(innerWidth-50,620);
  gridEl.style.setProperty('--s', Math.max(26,Math.min(48,Math.floor((avail-(cols-1)*6)/cols)))+'px');
}
sizeCells(); addEventListener('resize',sizeCells);
gridEl.style.gridTemplateColumns=`repeat(${cols},var(--s))`;
gridEl.style.gridTemplateRows=`repeat(${rows},var(--s))`;

WORDS.forEach((w,i)=>cellsOf(w).forEach(([r,c],j)=>{
  let o=cells.get(key(r,c));
  if(!o){o={r,c,ch:w.a[j],words:[],hinted:false};cells.set(key(r,c),o);}
  o.words.push(i);
}));

let sel=null, dir='across', again=false;
const val=o=>norm(o.el.value), ok=o=>val(o)===o.ch;

cells.forEach(o=>{
  const wrap=document.createElement('div'); wrap.className='cell';
  wrap.style.gridRow=o.r-minR+1; wrap.style.gridColumn=o.c-minC+1;
  wrap.style.transform=`rotate(${(((o.r*7+o.c*13)%5)-2)*.8}deg)`;   // лёгкий наклон стикера
  const inp=document.createElement('input');
  inp.maxLength=2; inp.autocomplete='off'; inp.autocapitalize='characters'; inp.spellcheck=false; inp.setAttribute('aria-label','Клетка');
  wrap.appendChild(inp);
  const w=WORDS.find(w=>w.r===o.r&&w.c===o.c);
  if(w){const s=document.createElement('span');s.className='num';s.textContent=w.n;wrap.appendChild(s);}
  o.el=inp; gridEl.appendChild(wrap);

  inp.addEventListener('focus',()=>{ if(sel!==o) select(o); });
  inp.addEventListener('click',()=>{ if(again) toggleDir(); again=true; });
  inp.addEventListener('beforeinput',e=>{ if(o.hinted&&e.inputType!=='deleteContentBackward') e.preventDefault(); });
  inp.addEventListener('input',()=>{
    const v=norm(inp.value).replace(/[^А-ЯA-Z]/g,'');
    inp.value=v.slice(-1); inp.classList.remove('wrong','right');
    if(v) move(1);
    refresh();
  });
  inp.addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='Backspace'&&!inp.value){ move(-1); if(sel&&!sel.hinted) sel.el.value=''; e.preventDefault(); refresh(); }
    else if(k==='ArrowRight'){dir='across';step(0,1);e.preventDefault();}
    else if(k==='ArrowLeft'){dir='across';step(0,-1);e.preventDefault();}
    else if(k==='ArrowDown'){dir='down';step(1,0);e.preventDefault();}
    else if(k==='ArrowUp'){dir='down';step(-1,0);e.preventDefault();}
    else if(k==='Enter'||k===' '){toggleDir();e.preventDefault();}
  });
});

function activeIdx(){
  if(!sel) return null;
  let i=sel.words.find(i=>WORDS[i].d===dir);
  if(i===undefined){i=sel.words[0];dir=WORDS[i].d;}
  return i;
}
function select(o){ again=(sel===o); sel=o; activeIdx(); if(document.activeElement!==o.el) o.el.focus(); refresh(); }
function toggleDir(){
  if(!sel) return; const other=dir==='across'?'down':'across';
  if(sel.words.some(i=>WORDS[i].d===other)){dir=other;refresh();}
}
function step(dr,dc){ if(!sel) return; const n=cells.get(key(sel.r+dr,sel.c+dc)); if(n){again=false;select(n);} }
function move(k){
  const i=activeIdx(); if(i===null) return;
  const list=cellsOf(WORDS[i]), idx=list.findIndex(([r,c])=>r===sel.r&&c===sel.c), nx=list[idx+k];
  if(nx){again=false;select(cells.get(key(...nx)));}
}

function refresh(){
  const ai=activeIdx(), act=ai===null?[]:cellsOf(WORDS[ai]).map(([r,c])=>key(r,c));
  cells.forEach((o,k)=>{
    o.el.classList.toggle('inword',act.includes(k));
    o.el.classList.toggle('sel',sel===o);
    o.el.classList.toggle('hinted',o.hinted);
    o.el.readOnly=o.hinted;
  });
  WORDS.forEach((w,i)=>{
    const li=$('clue'+i);
    li.classList.toggle('active',i===ai);
    li.classList.toggle('done',cellsOf(w).every(([r,c])=>ok(cells.get(key(r,c)))));
  });
  const list=[...cells.values()], good=list.filter(ok).length, solvedWords=WORDS.filter((w,i)=>$('clue'+i).classList.contains('done')).length;
  $('count').textContent=`Слов решено: ${solvedWords} из ${WORDS.length} · Подсказок: ${list.filter(o=>o.hinted).length}`;
  $('win').classList.toggle('show',good===list.length);
}

function reveal(o){ o.el.value=o.ch; o.hinted=true; o.el.classList.remove('wrong','right'); }
$('bLetter').onclick=()=>{
  let t=null;
  if(sel&&!ok(sel)) t=sel;
  if(!t){const ai=activeIdx(); if(ai!==null) t=cellsOf(WORDS[ai]).map(([r,c])=>cells.get(key(r,c))).find(o=>!ok(o))||null;}
  if(!t){const bad=[...cells.values()].filter(o=>!ok(o)); if(bad.length) t=bad[Math.floor(Math.random()*bad.length)];}
  if(t){reveal(t);sel=t;} refresh();
};
$('bWord').onclick=()=>{
  const ai=activeIdx(); if(ai===null) return;
  cellsOf(WORDS[ai]).forEach(([r,c])=>reveal(cells.get(key(r,c)))); refresh();
};
$('bCheck').onclick=()=>{
  cells.forEach(o=>{o.el.classList.remove('wrong','right'); if(o.el.value&&!o.hinted) o.el.classList.add(ok(o)?'right':'wrong');});
  setTimeout(()=>cells.forEach(o=>o.el.classList.remove('wrong','right')),2500);
};
$('bReset').onclick=()=>{
  cells.forEach(o=>{o.el.value='';o.hinted=false;o.el.classList.remove('wrong','right');}); refresh();
};

['across','down'].forEach(d=>{
  const ol=$(d==='across'?'cAcross':'cDown');
  WORDS.map((w,i)=>({w,i})).filter(x=>x.w.d===d).sort((a,b)=>a.w.n-b.w.n).forEach(({w,i})=>{
    const li=document.createElement('li'); li.id='clue'+i;
    li.innerHTML=`<b>${w.n}</b><span>${w.q} <small>(${w.a.length})</small></span>`;
    li.onclick=()=>{dir=w.d;again=false;const f=cellsOf(w).map(([r,c])=>cells.get(key(r,c))).find(o=>!o.el.value)||cells.get(key(w.r,w.c));select(f);};
    ol.appendChild(li);
  });
});
refresh();
</script>
</body>
</html>
